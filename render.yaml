# ========================================
# Render — Альфа бот (глобально)
# ========================================
# New → Blueprint → подключи репо.
# Render задеплоит бота автоматически.
# ========================================

services:
  - type: web
    name: alpha-bot
    runtime: node

    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /

    envVars:
      - key: ALPHA_BOT_TOKEN
        sync: false
      - key: ALPHA_API_KEY
        sync: false
      - key: ALPHA_API_FALLBACKS
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: z-ai/glm-5.3-flash
      - key: NVIDIA_MODEL_FALLBACKS
        value: openai/gpt-oss-20b
      - key: ALPHA_TELEGRAM_MODE
        value: webhook
      - key: NODE_VERSION
        value: "22"
